# FLEXS website: static files, single-page-app fallback, security headers, caching.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hidden files (for example the .htaccess kept for Apache hosts) are never served.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # App-link verification files must be served as JSON with no redirect.
    location /.well-known/ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        try_files $uri =404;
    }

    # Fingerprinted build files never change. A missing one is a real 404, never the app page.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Photos, town lists, icons and sitemaps: real files only, cached for a week.
    location ~ ^/(images|data|icons|sitemaps)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Single-page app: every other path (for example /app/leads) loads index.html, always fresh.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
