name: Marketplace checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python3 scripts/test-backend-readiness.py
      - run: bash -n scripts/deploy-backend.sh
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - name: Prepare image and text review evidence
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          python3 scripts/visual-audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: flexsca-visual-audit
          path: /tmp/flexsca-visual-audit/
          if-no-files-found: error
          retention-days: 14
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check --node-modules-dir=none --no-lock supabase/functions/create-checkout-session/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/takatak-attribution-worker/index.ts supabase/functions/takatak-opportunity-intake/index.ts
      - run: deno test --node-modules-dir=none --no-lock supabase/functions/_shared/stripe-runtime.test.ts
