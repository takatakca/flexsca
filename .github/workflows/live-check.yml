name: Live site check
# Opens the public website in a real browser every morning and after each deployment. Read-only.
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy FLEXS website']
    types: [completed]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/live-check.mjs "${{ vars.WEBSITE_URL || 'https://flexs.ca' }}"
